<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Urso · Inkspace</title>
    <meta name="description" content="Urso 的技术笔记、学习记录与日常思考。">
    <meta name="theme-color" content="#f6f4ed">
    <!-- Apply the saved color scheme before styles paint. -->
    <script src="assets/inkspace.js"></script>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
    <link rel="stylesheet" href="assets/obsidian-callouts.css">
    <link rel="stylesheet" href="assets/site.css">
</head>

<body>
    <header class="inkspace-header">
        <div class="inkspace-identity">
            <button class="inkspace-nav-toggle" type="button" aria-label="打开笔记目录" aria-expanded="false" aria-controls="__sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a class="inkspace-brand" href="#/" aria-label="Urso Inkspace首页">
                <span class="inkspace-mark" aria-hidden="true">u.</span>
                <span>Inkspace <span class="inkspace-wordmark">URSO / NOTES</span></span>
            </a>
        </div>
        <div class="inkspace-tools">
            <a class="inkspace-github" href="https://github.com/UrsoCN/Docs" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
            <button class="theme-toggle" type="button" aria-label="切换到夜间模式" aria-pressed="false">
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"/></svg>
                <span class="theme-toggle-label">日间</span>
            </button>
        </div>
    </header>
    <!-- 定义加载时候的动作 -->
    <div id="app">Loading...</div>
    <script>
        window.$docsify = {
            // 项目名称
            name: 'Urso 的笔记',
            // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
            loadSidebar: true,
            // 封面支持，默认加载的是项目根目录下的_coverpage.md文件
            coverpage: true,
            // 最大支持渲染的标题层级
            maxLevel: 5,
            // 当前仓库使用文件相对路径，便于编辑器直接跳转文档
            relativePath: true,
            // 所有目录都复用 docs 根目录下的_sidebar.md
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
            },

            // LaTeX 数学公式渲染配置 (支持 $...$ 行内和 $$...$$ 块级公式)
            latex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']],
                customOptions: {
                    throwOnError: false
                }
            },

            // 自定义 Markdown 渲染器
            markdown: {
                renderer: {
                    link: function (token) {
                        var href = token.href;
                        var nextHref = href;

                        // Keep docs/_sidebar.md editor-friendly while rendering root navigation
                        // as absolute docsify routes under relativePath mode.
                        if (typeof href === 'string' && (href.startsWith('./subpage/') || href.startsWith('subpage/'))) {
                            nextHref = '/' + href.replace(/^\.\//, '');
                        }

                        // Resolve paper attachments against the article, outside hash routing.
                        // Keep the deployment directory (e.g. /Docs/) in the resulting URL.
                        if (typeof href === 'string' && /\.pdf(?:[?#]|$)/i.test(href) &&
                            !/^(?:[a-z][a-z\d+.-]*:|\/\/)/i.test(href)) {
                            var routePath = window.location.hash.slice(1).split('?')[0] || '/README';
                            var siteURL = new URL('./', window.location.href);
                            var articleURL = new URL(routePath.replace(/^\//, ''), siteURL);
                            nextHref = new URL(href, articleURL).href;
                        }

                        return this.origin.link.call(this, Object.assign({}, token, { href: nextHref }));
                    },
                    code: function ({ text: code, lang }) {
                        if (lang === 'tex') {
                            return '<span class="tex">' + katex.renderToString(code, { throwOnError: false, displayMode: true }) + '</span>';
                        }
                        return this.origin.code.apply(this, arguments);
                    }
                },
            },
            // 搜索配置(url：https://docsify.js.org/#/zh-cn/plugins?id=%e5%85%a8%e6%96%87%e6%90%9c%e7%b4%a2-search)
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索笔记…',
                noData: '找不到结果',
                depth: 4,
                hideOtherSidebarContent: false,
                namespace: 'Docs-v5',
            },
            toc: {
                tocMaxLevel: 5,
                target: 'h2, h3, h4, h5, h6',
            },

        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"></script>
    <!-- Mermaid 图表渲染支持 -->
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.esm.min.mjs";
      window.mermaid = mermaid;
    </script>
    <script src="assets/inkspace-mermaid.js"></script>
    <!-- Obsidian 标注：保留标题与 +/- 折叠 -->
    <script src="assets/obsidian-callouts.js"></script>
    <script src="assets/sidebar-folding.js"></script>
    <!-- Docsify 核心和内置插件固定到同一版本 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/docsify.min.js"></script>
    <!-- KaTeX LaTeX 数学公式渲染插件 (支持 $...$ 行内和 $$...$$ 块级公式) -->
    <script src="assets/vendor/docsify-latex-0.5.2.js"></script>
    <!-- v5 已内置 emoji；单独加载 front-matter 隐藏 YAML 元数据 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/front-matter.min.js"></script>
    <!-- 图片放大缩小支持 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/zoom-image.min.js"></script>
    <!-- 搜索功能支持 -->
    <script src="assets/vendor/docsify-search-5.1.0.js"></script>
    <!--在所有的代码块上添加一个简单的Click to copy按钮来允许用户从你的文档中轻易地复制代码-->
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
    <!-- 代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-makefile.min.js"></script>
    <!-- PlantUML support for code block diagrams -->
    <script src="https://unpkg.com/docsify-plantuml@1.3.2/dist/docsify-plantuml.min.js"></script>
    <script src="assets/vendor/docsify-plugin-toc-1.3.1.js"></script>


</body>

</html>
